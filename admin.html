<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | YRB Nova</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0b0d'/%3E%3Ctext x='50' y='69' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='56' fill='%23e8874a' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">

<style>
    body { background: var(--bg); }
    .admin-shell { max-width: 1180px; margin: 0 auto; padding: 40px 24px 100px; }
    .admin-topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 20px 0 32px; border-bottom: 1px solid var(--line); margin-bottom: 36px;
    }
    .admin-topbar .site-logo { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
    .admin-topbar .site-logo span { color: var(--accent); }

    .login-wrap {
        max-width: 380px; margin: 100px auto; padding: 40px;
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    }
    .login-wrap h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .login-wrap p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px; }
    .login-wrap input {
        width: 100%; padding: 13px 14px; margin-bottom: 16px;
        background: var(--bg-alt); border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
        color: var(--text); font-family: var(--font-body); font-size: 1rem;
    }
    .login-wrap input:focus { outline: none; border-color: var(--accent); }
    .login-wrap .btn { width: 100%; justify-content: center; }
    .login-error { color: #ff6b6b; font-size: 0.85rem; margin-top: 14px; display: none; }

    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 44px; }
    .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
    .stat-card .label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dimmer); margin-bottom: 10px; }
    .stat-card .value { font-family: var(--font-display); font-size: 2rem; font-weight: 700; }

    .admin-section { margin-bottom: 56px; }
    .admin-section h2 { font-size: 1.4rem; margin-bottom: 20px; }

    .admin-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
    table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 720px; }
    table.admin-table th {
        text-align: left; padding: 14px 16px; background: var(--surface-2);
        font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dimmer);
        border-bottom: 1px solid var(--line);
    }
    table.admin-table td { padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--text-dim); vertical-align: top; }
    table.admin-table tr:last-child td { border-bottom: none; }
    table.admin-table td.strong { color: var(--text); font-weight: 600; }
    table.admin-table select, table.admin-table input[type="text"] {
        background: var(--bg-alt); border: 1px solid var(--line-strong); border-radius: 6px;
        color: var(--text); font-family: var(--font-body); font-size: 0.85rem; padding: 6px 8px;
    }
    .empty-state { padding: 40px; text-align: center; color: var(--text-dimmer); }

    .status-pill {
        display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 0.72rem;
        font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-pill.new { background: rgba(232,135,74,0.18); color: var(--accent); }
    .status-pill.contacted { background: rgba(77,116,255,0.18); color: #7f9cff; }
    .status-pill.closed { background: rgba(255,255,255,0.08); color: var(--text-dimmer); }
    .status-pill.paid { background: rgba(76,201,133,0.18); color: #4dd08a; }

    #dashboard { display: none; }
    .loading-note { color: var(--text-dimmer); padding: 30px 0; }
</style>
</head>

<body>

<div class="admin-shell">

    <div id="login-screen">
        <div class="login-wrap">
            <h1>Admin</h1>
            <p>Sign in to view bookings and enquiries.</p>
            <form id="login-form">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary">Sign In</button>
                <p class="login-error" id="login-error"></p>
            </form>
        </div>
    </div>

    <div id="dashboard">
        <div class="admin-topbar">
            <div class="site-logo">YRB <span>NOVA</span> ADMIN</div>
            <button id="logout-btn" class="btn btn-outline">Log Out</button>
        </div>

        <div class="stat-row">
            <div class="stat-card">
                <div class="label">Total Revenue</div>
                <div class="value" id="stat-revenue">&pound;0</div>
            </div>
            <div class="stat-card">
                <div class="label">Bookings</div>
                <div class="value" id="stat-bookings">0</div>
            </div>
            <div class="stat-card">
                <div class="label">New Enquiries</div>
                <div class="value" id="stat-enquiries">0</div>
            </div>
        </div>

        <div class="admin-section">
            <h2>Bookings</h2>
            <div class="admin-table-wrap">
                <table class="admin-table" id="bookings-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Package</th>
                            <th>Amount</th>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Project Details</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-body"></tbody>
                </table>
                <div class="empty-state" id="bookings-empty" style="display:none;">No bookings yet.</div>
            </div>
        </div>

        <div class="admin-section">
            <h2>Enquiries</h2>
            <div class="admin-table-wrap">
                <table class="admin-table" id="enquiries-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Budget</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody id="enquiries-body"></tbody>
                </table>
                <div class="empty-state" id="enquiries-empty" style="display:none;">No enquiries yet.</div>
            </div>
        </div>
    </div>

</div>

<script>
    const loginScreen = document.getElementById('login-screen');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    function money(n) {
        return '£' + Number(n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function dateStr(iso) {
        return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    function showDashboard() {
        loginScreen.style.display = 'none';
        dashboard.style.display = 'block';
        loadBookings();
        loadEnquiries();
    }

    function showLogin() {
        dashboard.style.display = 'none';
        loginScreen.style.display = 'block';
    }

    async function loadBookings() {
        const res = await fetch('/api/admin/bookings');
        if (res.status === 401) return showLogin();
        const data = await res.json();
        const body = document.getElementById('bookings-body');
        const empty = document.getElementById('bookings-empty');
        body.innerHTML = '';

        if (!data.bookings || data.bookings.length === 0) {
            empty.style.display = 'block';
        } else {
            empty.style.display = 'none';
            let revenue = 0;
            data.bookings.forEach(b => {
                revenue += Number(b.amount_gbp || 0);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${dateStr(b.created_at)}</td>
                    <td class="strong">${escapeHtml(b.package)}</td>
                    <td>${money(b.amount_gbp)}</td>
                    <td>${escapeHtml(b.customer_name) || '&mdash;'}</td>
                    <td>${escapeHtml(b.customer_email) || '&mdash;'}</td>
                    <td>${escapeHtml(b.project_details) || '&mdash;'}</td>
                    <td><span class="status-pill paid">${escapeHtml(b.status)}</span></td>
                `;
                body.appendChild(tr);
            });
            document.getElementById('stat-revenue').textContent = money(revenue);
            document.getElementById('stat-bookings').textContent = data.bookings.length;
        }
    }

    async function loadEnquiries() {
        const res = await fetch('/api/admin/enquiries');
        if (res.status === 401) return showLogin();
        const data = await res.json();
        const body = document.getElementById('enquiries-body');
        const empty = document.getElementById('enquiries-empty');
        body.innerHTML = '';

        if (!data.enquiries || data.enquiries.length === 0) {
            empty.style.display = 'block';
            document.getElementById('stat-enquiries').textContent = '0';
        } else {
            empty.style.display = 'none';
            let newCount = 0;
            data.enquiries.forEach(e => {
                if (e.status === 'new') newCount++;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${dateStr(e.created_at)}</td>
                    <td class="strong">${escapeHtml(e.name)}</td>
                    <td>${escapeHtml(e.email)}</td>
                    <td>${escapeHtml(e.budget) || '&mdash;'}</td>
                    <td style="max-width:280px;">${escapeHtml(e.message)}</td>
                    <td>
                        <select data-id="${e.id}" class="status-select">
                            <option value="new" ${e.status === 'new' ? 'selected' : ''}>New</option>
                            <option value="contacted" ${e.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                            <option value="closed" ${e.status === 'closed' ? 'selected' : ''}>Closed</option>
                        </select>
                    </td>
                    <td><input type="text" data-id="${e.id}" class="notes-input" value="${escapeHtml(e.notes) || ''}" placeholder="Add a note..."></td>
                `;
                body.appendChild(tr);
            });
            document.getElementById('stat-enquiries').textContent = newCount;

            body.querySelectorAll('.status-select').forEach(sel => {
                sel.addEventListener('change', () => updateEnquiry(sel.dataset.id, { status: sel.value }));
            });
            body.querySelectorAll('.notes-input').forEach(inp => {
                inp.addEventListener('blur', () => updateEnquiry(inp.dataset.id, { notes: inp.value }));
            });
        }
    }

    async function updateEnquiry(id, patch) {
        await fetch('/api/admin/enquiries', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, ...patch })
        });
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.style.display = 'none';
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();

            if (!res.ok) {
                loginError.textContent = data.error || 'Incorrect password';
                loginError.style.display = 'block';
                return;
            }

            showDashboard();
        } catch (err) {
            loginError.textContent = 'Something went wrong. Please try again.';
            loginError.style.display = 'block';
        }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
        await fetch('/api/admin/logout', { method: 'POST' });
        showLogin();
    });

    // On load, check if there's already a valid session
    (async () => {
        const res = await fetch('/api/admin/bookings');
        if (res.status === 401) {
            showLogin();
        } else {
            showDashboard();
        }
    })();
</script>

</body>
</html>
